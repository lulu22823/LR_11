<!doctype html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Каталог комплектуючих – Supabase</title>
  <link rel="stylesheet" href="styles/style.css">
  <script type="module" src="JavaScript/script.js"></script>
</head>
<body>
  <main class="container">
    <h1>Каталог комп'ютерних комплектуючих</h1>
    <p id="status" role="status" aria-live="polite"></p>

    <section class="controls" aria-label="Пошук та фільтрація">
          <input type="search" id="search-input" placeholder="Пошук за назвою...">

          <select id="category-filter">
            <option value="all">Усі категорії</option>
            <option value="Процесор">Процесор</option>
            <option value="Відеокарта">Відеокарта</option>
            <option value="Оперативна пам'ять">Оперативна пам'ять</option>
            <option value="SSD-накопичувач">SSD-накопичувач</option>
            <option value="Материнська плата">Материнська плата</option>
          </select>

          <select id="sort-select">
            <option value="id-asc">За замовчуванням</option>
            <option value="price-asc">Спочатку дешевші</option>
            <option value="price-desc">Спочатку дорожчі</option>
            <option value="name-asc">За назвою (А–Я)</option>
          </select>
        </section>

    <section aria-labelledby="components-heading">
      <h2 id="components-heading">Список комплектуючих</h2>
      <ul id="components-list"></ul>
    </section>

    <section aria-labelledby="form-heading">
      <h2 id="form-heading">Додати комплектуючу</h2>
      <form id="component-form">
        <label for="name">Назва</label>
        <input id="name" name="name" required maxlength="150">

        <label for="category">Категорія</label>
        <input id="category" name="category" required maxlength="100">

        <label for="price">Ціна (грн)</label>
        <input id="price" name="price" type="number" required min="1">

        <button type="submit">Додати</button>
      </form>
    </section>
  </main>
</body>
</html>
